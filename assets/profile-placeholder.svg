<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">DR monogram</title>
  <desc id="desc">A violet and teal abstract monogram placeholder for Dr. Raavi Deepthi's profile photograph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8177f0"/><stop offset="1" stop-color="#40368f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ce0d2"/><stop offset="1" stop-color="#fff"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="#eeecff"/>
